<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enphase Local Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1 class="app-title">Enphase Local Dashboard <span>⚡</span></h1>
            <p class="config-info">Gateway: <span class="gateway-ip">{{ config.gateway_ip }}</span></p>
        </header>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="openTab(event, 'live-tab')">Live Power</button>
            <button class="tab-btn" onclick="openTab(event, 'summary-tab')">Production Summary</button>
            <button class="tab-btn" onclick="openTab(event, 'history-tab')">Daily History</button>
            <button class="tab-btn" onclick="openTab(event, 'phase-tab')">Phase Details</button>
            <button class="tab-btn" onclick="openTab(event, 'health-tab')">System Health</button>
            <button class="tab-btn" onclick="openTab(event, 'connectivity-tab')">Connectivity</button>
            <button class="tab-btn" onclick="openTab(event, 'events-tab')">Event Logs</button>
            <button class="tab-btn" onclick="openTab(event, 'specs-tab')">System Specs</button>
        </div>

        {% block content %}{% endblock %}
    </div>

    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
