<div style="display:flex; justify-content:space-between; align-items:center;">
    <h2>Per-Inverter Health & Status</h2>
    <button class="refresh-btn" @click="fetchHealth()" :disabled="loadingHealth">
        <span x-text="loadingHealth ? 'Refreshing...' : 'Refresh Health'"></span>
    </button>
</div>

<div style="margin-bottom: 1rem; font-weight: bold; padding-top: 1rem; display: flex; gap: 10px; flex-wrap: wrap;" x-show="healthSummary.total > 0">
    <span class="status-tag" :class="healthSummary.operating === healthSummary.total ? 'status-ok' : 'status-err'" x-text="'Operating: ' + healthSummary.operating + '/' + healthSummary.total"></span>
    <span class="status-tag" :class="healthSummary.producing === healthSummary.total ? 'status-ok' : 'status-err'" x-text="'Producing: ' + healthSummary.producing + '/' + healthSummary.total"></span>
    <span class="status-tag" :class="healthSummary.communicating === healthSummary.total ? 'status-ok' : 'status-err'" x-text="'Communicating: ' + healthSummary.communicating + '/' + healthSummary.total"></span>
</div>

<div class="data-box" x-show="loadingHealth && inverters.length === 0">
    <p class="loading">Updating inverter status...</p>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.25rem; margin-top: 1.5rem;" x-show="inverters.length > 0">
    <template x-for="inv in inverters" :key="inv.serial_num">
        <div class="data-box" style="margin-top: 0; padding: 1.25rem; border-top: 4px solid var(--primary);" :style="{ borderTopColor: (inv.operating && inv.producing && inv.communicating) ? 'var(--success)' : 'var(--danger)' }">
            <h4 style="margin: 0 0 0.5rem 0; color: var(--text-main); font-weight: 700;" x-text="'SN: ' + inv.serial_num"></h4>
            <p style="margin: 0.25rem 0; font-size: 0.9rem; color: var(--text-muted);">
                <strong>Model:</strong> <span style="color: var(--text-main); font-weight: 600;" x-text="inv.part_num"></span>
            </p>
            <p style="margin: 0.25rem 0; font-size: 0.9rem; color: var(--text-muted);">
                <strong>Reported:</strong> <span style="color: var(--text-main);" x-text="formatDate(inv.last_rpt_date)"></span>
            </p>
            <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 0.75rem;">
                <span class="status-tag" :class="inv.operating ? 'status-ok' : 'status-err'">OP</span>
                <span class="status-tag" :class="inv.producing ? 'status-ok' : 'status-err'">PROD</span>
                <span class="status-tag" :class="inv.communicating ? 'status-ok' : 'status-err'">COMM</span>
            </div>
        </div>
    </template>
</div>

<div class="data-box">
    <details>
        <summary>Raw Inventory JSON</summary>
        <pre x-text="rawInventory">No data yet.</pre>
    </details>
</div>
