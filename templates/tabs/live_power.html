<div style="display:flex; justify-content:space-between; align-items:center;">
    <h2>Real-Time Meter Readings</h2>
    <div style="display: flex; align-items: center; gap: 10px;">
        <label for="refresh-rate" style="font-size: 0.9rem; font-weight: bold;">Auto-Refresh:</label>
        <select id="refresh-rate" onchange="updateRefreshInterval()" style="padding: 0.4rem; border-radius: 4px; border: 1px solid #ddd;">
            <option value="0">Off</option>
            <option value="1000">1 Second</option>
            <option value="3000" selected>3 Seconds</option>
            <option value="5000">5 Seconds</option>
        </select>
        <button class="refresh-btn" onclick="fetchMeters()">Refresh Now</button>
    </div>
</div>
<div id="live-data" class="data-box">
    <!-- 1. Production -->
    <div class="live-card">
        <div>
            <div class="live-label">Solar Production</div>
            <div style="font-size:0.85rem; color:#666;">Generating power from panels</div>
        </div>
        <div id="val-prod" class="live-val" style="color: #28a745;">0 W</div>
    </div>

    <!-- 2. Grid -->
    <div class="live-card">
        <div>
            <div id="label-grid" class="live-label">Grid Flow</div>
            <div style="font-size:0.85rem; color:#666;">Net flow at the meter</div>
        </div>
        <div id="val-grid" class="live-val">0 W</div>
    </div>

    <!-- 3. Consumption -->
    <div class="live-card" style="background: #fff8f0; border-top: 2px solid #ff6600; margin-top: 1rem;">
        <div>
            <div class="live-label">House Consumption</div>
            <div style="font-size:0.85rem; color:#666;">Total power being used by home</div>
        </div>
        <div id="val-cons" class="live-val" style="color: #ff6600;">0 W</div>
    </div>
</div>
<div class="data-box">
    <details>
        <summary style="cursor: pointer; font-weight: bold; color: #ff6600;">Raw Meters JSON</summary>
        <pre id="raw-meters" style="margin-top: 1rem;">No data yet.</pre>
    </details>
</div>
